<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>QR Reader</title>
<style>
:root{--bg:#0f1318;--card:#1a2029;--ink:#eef2f6;--sub:#9aa5b5;--ok:#34c77b;--blue:#5b8cff;--warn:#ffd60a;--ng:#ff8a4c;--line:#2c3442}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Hiragino Sans","BIZ UDPGothic",sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px}
header h1{font-size:15px;margin:0}
#mode{font-size:12px;color:var(--sub)}
.cam{position:relative;margin:0 10px;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:52vh;width:calc(100% - 20px)}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:14%;border:3px solid rgba(255,255,255,.55);border-radius:12px;transition:border-color .15s,box-shadow .15s}
.cam .frame.ok{border-color:var(--ok);box-shadow:0 0 0 999px rgba(52,199,123,.18)}
.cam .frame.dup{border-color:var(--warn)}
.cam .msg{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-weight:700;font-size:15px;text-shadow:0 1px 3px #000}
.cam .start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#000;text-align:center;padding:20px}
.big{border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:17px;padding:12px 20px;min-height:48px;font-family:inherit;cursor:pointer}
.row{display:flex;gap:8px;margin:10px}
.row>*{flex:1}
.btn{border:2px solid var(--ok);border-radius:10px;background:var(--card);color:var(--ink);font-weight:700;font-size:14px;min-height:42px;font-family:inherit;cursor:pointer}
.btn.main{background:var(--ok);color:#06210f;border-color:var(--ok);font-size:16px}
.btn.del{border-color:var(--ng);color:var(--ng)}
.count{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:8px 10px 0}
.count b{font-size:44px;line-height:1;background:var(--warn);color:#151515;border-radius:10px;padding:2px 14px}
.count span{color:var(--sub)}
.sum{display:flex;flex-wrap:wrap;gap:6px;margin:8px 10px}
.sum span{background:var(--card);border:1.5px solid var(--ok);border-radius:16px;padding:2px 10px;font-size:13px}
ul{list-style:none;margin:0 10px 10px;padding:0;border:2px solid var(--ok);border-radius:12px;max-height:30vh;overflow:auto}
li{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-size:14px}
li:last-child{border-bottom:0}
li .t{flex:1}li small{display:block;color:var(--sub);font-size:12px}
li button{border:0;background:transparent;color:var(--ng);font-weight:700;font-size:13px;min-height:32px;min-width:40px}
.note{color:var(--sub);font-size:13px;margin:4px 12px 12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.empty{color:var(--sub);text-align:center;padding:14px}
</style>
</head>
<body>
<header><h1>QR連続読み取り</h1><span id="eng">準備中…</span></header>
<div class="cam" id="cam">
  <video id="v" playsinline muted autoplay></video>
  <div class="frame" id="frame"></div>
  <div class="msg" id="msg"></div>
  <div class="start" id="start">
    <div style="font-size:15px">QRにカメラを向けるだけで、次々に読み取ります。<br>読めたら「ピッ」と鳴って緑に光ります。</div>
    <button class="big" id="go">カメラを起動</button>
    <div style="font-size:12px;color:#9aa5b5">カメラの許可を聞かれたら「許可」を押してください。<br>音が出るように、消音スイッチを切ってください。</div>
  </div>
</div>
<div class="count"><span>読んだ</span><b id="n">0</b><span>件</span></div>
<div class="sum" id="sum"></div>
<div class="row"><button class="btn main" id="send">コピー</button></div>
<ul id="list"></ul>
<div class="row"><button class="btn" id="torch" style="display:none">ライト</button><button class="btn" id="stop">カメラを止める</button><button class="btn del" id="clear">全部消す</button></div>
<p class="note">読み取った内容はこの端末の中だけに残ります。「コピー」で貼り付けて使います。</p>
<div id="toast"></div>
<script src="jsQR.js"></script>
<script src="zxing-reader.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2000)};

function parseSeiban(c){if(!/^5\d{6}/.test(c)||c.length<33)return null;return{no:c.slice(7,15),model:c.slice(15,25).trim(),ph:c.slice(5,7)}}
function parse1G(c){const m=String(c).match(/^([A-Z0-9][A-Z0-9-]{2,11})\s+(\d{2})\d{0,10}?([A-Z]\d{2}[A-Z]\d{7})/);return m?{model:m[1],ph:m[2],no:m[3]}:null}
const keyOf=c=>{const s=parseSeiban(c);if(s)return s.no[0]+s.no.slice(-6);const g=parse1G(c);return g?g.no[0]+g.no.slice(-6):null};
const label=c=>{const s=parseSeiban(c),g=parse1G(c);return{name:'No. '+(s||g).no,no:(s||g).no,model:(s||g).model}};
let L=[];try{L=JSON.parse(localStorage.getItem('ms_list')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('ms_list',JSON.stringify(L))}catch(e){}};
function draw(){
  $('n').textContent=L.length;
  $('sum').innerHTML='';
  $('list').innerHTML=L.length?L.slice().reverse().map(x=>{const l=label(x.c);return `<li><div class="t">${esc(l.name)}</div><button data-k="${esc(x.k)}">消す</button></li>`}).join(''):'<li class="empty">まだ読んでいません</li>';
}
$('list').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;L=L.filter(x=>x.k!==b.dataset.k);save();draw()};
$('clear').onclick=e=>{const b=e.currentTarget;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='もう一度押すと消します';setTimeout(()=>{delete b.dataset.sure;b.textContent='全部消す'},3000);return}L=[];save();draw();delete b.dataset.sure;b.textContent='全部消す';toast('全部消しました')};
$('send').onclick=async()=>{if(!L.length){toast('まだ読んでいません');return}const txt=L.map(x=>x.c).join('\n');
  try{await navigator.clipboard.writeText(txt);toast(L.length+'件コピーしました')}catch(e){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('コピーしました')}catch(_){toast('コピーできませんでした')}t.remove()}};
/* 音 */
let ac=null;
function beep(ok){try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=ok?'sine':'square';o.frequency.value=ok?1500:220;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.4,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(ok?.12:.3));o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+(ok?.13:.32))}catch(e){}}
/* 読み取り部品 */
let zx=false;
try{ZXingWASM.prepareZXingModule({overrides:{locateFile:(p,pre)=>p.endsWith('.wasm')?new URL('zxing_reader.wasm',location.href).href:pre+p},fireImmediately:true}).then(()=>{zx=true;$('eng').textContent='読み取り：強'}).catch(()=>{$('eng').textContent='読み取り：標準'})}catch(e){$('eng').textContent='読み取り：標準'}
/* カメラ */
let stream=null,busy=false,lastDup={};
const v=$('v'),cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
async function start(){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false})}
  catch(e){toast('カメラが使えません（'+(e.name||'')+'）。設定でカメラを許可してください');return}
  v.srcObject=stream;try{await v.play()}catch(e){}
  $('start').style.display='none';$('msg').textContent='QRを枠に入れてください';
  const tr=stream.getVideoTracks()[0];try{const cap=tr.getCapabilities&&tr.getCapabilities();if(cap&&cap.torch)$('torch').style.display=''}catch(e){}
  loop();
}
let torchOn=false;$('torch').onclick=async()=>{try{torchOn=!torchOn;await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:torchOn}]})}catch(e){toast('ライトが使えません')}};
function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('start').style.display='flex';$('go').textContent='カメラを起動'}
$('go').onclick=start;$('stop').onclick=stop;
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
function flash(cls,txt){const f=$('frame');f.className='frame '+cls;$('msg').textContent=txt;clearTimeout(flash.t);flash.t=setTimeout(()=>{f.className='frame';$('msg').textContent='QRを枠に入れてください'},700)}
async function loop(){
  if(!stream)return;
  const w=v.videoWidth,h=v.videoHeight;
  if(w&&!busy){busy=true;
    try{const k=Math.min(1,1600/Math.max(w,h));cv.width=Math.round(w*k);cv.height=Math.round(h*k);cx.drawImage(v,0,0,cv.width,cv.height);
      const id=cx.getImageData(0,0,cv.width,cv.height),codes=new Set();
      if(zx){(await ZXingWASM.readBarcodes(id,{formats:['QRCode'],tryHarder:true,maxNumberOfSymbols:8})).forEach(b=>b.isValid&&b.text&&codes.add(b.text))}
      else if(window.jsQR){const q=jsQR(id.data,id.width,id.height,{inversionAttempts:'dontInvert'});if(q&&q.data)codes.add(q.data)}
      for(const c of codes){const k2=keyOf(c);if(!k2)continue;
        if(L.some(x=>x.k===k2)){if(!lastDup[k2]||Date.now()-lastDup[k2]>2500){lastDup[k2]=Date.now();flash('dup','読み取り済み');beep(false)}continue}
        L.push({k:k2,c,t:Date.now()});save();draw();beep(true);const l=label(c);flash('ok','✓ '+L.length+'件目');
      }
    }catch(e){}
    busy=false}
  setTimeout(loop,120);
}
draw();
}
</script>
</body>
</html>
